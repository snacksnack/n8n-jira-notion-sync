name: CI

# RC1-404. This repo had no tests and no CI while a workflow it owns writes to
# Jira and Notion unattended every 2 hours. The contract suite reads the
# committed workflow JSON — no network, no n8n, no credentials — so it gates
# on every push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      # The contract layer: node names, echo suppression, lookback vs
      # schedule, log-node error handling, no literal secrets — all read out
      # of the committed workflow JSON.
      # RC1-452: --ddtrace reports test-level results to Test Optimization,
      # agentless. Not a test credential: a missing key logs an error and
      # runs the suite untouched. No --cov here deliberately: the program is
      # the JSON, and there is no product Python for a coverage figure to
      # measure (RC1-468).
      - name: Test (pytest)
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
          DD_SITE: datadoghq.com
          DD_SERVICE: n8n-jira-notion-sync
          DD_ENV: ci
        run: pytest --ddtrace
